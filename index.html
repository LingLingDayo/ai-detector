<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Detector - AI模型检测器</title>
    <script>
      // 首屏渲染前恢复主题，避免非默认风格启动时闪色
      (function () {
        try {
          var raw = localStorage.getItem("modeltrace_settings");
          var settings = raw ? JSON.parse(raw) : null;
          var theme = settings && settings.theme;
          if (theme === "light" || theme === "midnight") {
            document.documentElement.dataset.theme = theme;
          }
        } catch (e) {
          /* 忽略无法读取的本地设置 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModelTrace - AI 模型归因检测</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- 顶部标题栏 -->
      <header class="app-header">
        <div class="brand">
          <div class="brand-icon" title="ModelTrace AI 探测器">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" />
            </svg>
          </div>
          <div>
            <h1 class="brand-title">ModelTrace <span>Detector</span></h1>
            <p class="brand-subtitle" title="基于长整数生成指纹的主动式 AI 模型归因检测">AI 模型主动指纹归因探测系统</p>
          </div>
        </div>
        <div class="header-badges">
          <span class="badge" id="bank-badge" title="当前指纹库已收录 13 个主流前沿模型">
            <span class="badge-dot"></span>
            13 个模型已就绪
          </span>
        </div>
      </header>

      <!-- 主要内容区域 -->
      <main class="app-main">
        <!-- 配置输入卡片 -->
        <section class="card config-card">
          <div class="card-header">
            <h2>探测参数配置</h2>
            <span class="auto-save-tip" id="save-tip" title="输入内容会在本地实时自动持久化">已自动保存配置</span>
          </div>

          <form id="test-form" class="config-form">
            <!-- 第一行：Base URL 与 API Key -->
            <div class="form-row">
              <div class="form-group flex-1">
                <label for="base-url" title="API 根域名或网关地址，支持反代与中转地址">Base URL</label>
                <div class="input-wrapper">
                  <input
                    type="url"
                    id="base-url"
                    placeholder="https://api.openai.com"
                    required
                    autocomplete="off"
                    spellcheck="false"
                    title="API 接口根路径，例如 https://api.openai.com 或中转域名"
                  />
                </div>
              </div>

              <div class="form-group flex-1">
                <label for="api-key" title="用于鉴权的 API 密钥，仅保存在本电脑本地">API Key</label>
                <div class="input-wrapper">
                  <input
                    type="password"
                    id="api-key"
                    placeholder="sk-..."
                    required
                    autocomplete="off"
                    spellcheck="false"
                    title="API Key 访问凭据，仅存储在本地 localStorage"
                  />
                  <button type="button" class="btn-icon" id="toggle-key-visibility" title="切换显示/隐藏 Key">
                    <svg class="eye-open" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg class="eye-closed hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                      <line x1="1" y1="1" x2="23" y2="23" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- 第二行：模型选择下拉组件 -->
            <div class="form-row">
              <div class="form-group flex-1 model-select-group">
                <label for="model-name" title="指定要测试的模型 ID，支持手动输入或从下方下拉获取列表中选择">
                  待测模型 (Model)
                </label>
                <div class="model-combobox-wrapper" id="combobox-wrapper">
                  <input
                    type="text"
                    id="model-name"
                    value="gpt-4o"
                    required
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="请输入或选择模型 ID"
                    title="待测模型 ID。可点击右侧下拉按钮或刷新按钮自动获取当前 Key 允许的模型列表"
                  />
                  <div class="combobox-actions">
                    <button
                      type="button"
                      class="btn-icon"
                      id="btn-fetch-models"
                      title="点击调用 /v1/models 接口自动获取当前 Key 允许的模型列表"
                    >
                      <svg class="refresh-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
                      </svg>
                    </button>
                    <button
                      type="button"
                      class="btn-icon"
                      id="btn-toggle-dropdown"
                      title="展开/收起模型选择列表"
                    >
                      <svg class="dropdown-chevron" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                      </svg>
                    </button>
                  </div>

                  <!-- 下拉菜单 -->
                  <div class="model-dropdown-menu hidden" id="model-dropdown">
                    <div class="dropdown-search-wrap">
                      <input
                        type="text"
                        id="dropdown-search"
                        placeholder="搜索模型过滤..."
                        autocomplete="off"
                        spellcheck="false"
                        title="输入关键词实时过滤模型"
                      />
                    </div>
                    <div class="dropdown-status-bar" id="dropdown-status-bar">
                      <span>常用推荐模型</span>
                    </div>
                    <ul class="dropdown-list" id="dropdown-list">
                      <!-- 动态填充 -->
                    </ul>
                  </div>
                </div>
              </div>
            </div>

            <!-- 更多设置折叠区 -->
            <div class="accordion-item" id="advanced-settings-accordion">
              <button
                type="button"
                class="accordion-trigger"
                id="toggle-advanced"
                title="展开或收起高级端点与请求参数设置"
              >
                <div class="trigger-content">
                  <svg class="gear-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                  </svg>
                  <span>更多设置</span>
                  <span class="settings-summary" id="settings-summary">OpenAI 端点</span>
                </div>
                <svg class="chevron-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </button>

              <div class="accordion-panel hidden" id="advanced-panel">
                <div class="advanced-grid">
                  <!-- 端点协议选择 -->
                  <div class="advanced-row">
                    <label title="选择调用的 API 规范与端点路径格式">接口协议端点</label>
                    <div class="segmented-control">
                      <label class="segment" title="使用 OpenAI 规范 (/v1/chat/completions) 及 Bearer 认证">
                        <input type="radio" name="endpoint-format" value="openai" checked />
                        <span class="segment-label">OpenAI 原生 / 兼容端点</span>
                      </label>
                      <label class="segment" title="使用 Claude Messages 规范 (/v1/messages) 及 x-api-key 认证">
                        <input type="radio" name="endpoint-format" value="anthropic" />
                        <span class="segment-label">Claude Messages 端点</span>
                      </label>
                    </div>
                  </div>

                  <!-- 温度与超时 -->
                  <div class="advanced-columns">
                    <div class="form-group flex-1">
                      <label for="temperature" title="采样温度 Temperature，留空表示使用模型默认值">采样温度</label>
                      <input
                        type="number"
                        id="temperature"
                        step="0.1"
                        min="0"
                        max="2"
                        placeholder="默认"
                        title="数值越大随机性越强，留空使用模型默认设置"
                      />
                    </div>

                    <div class="form-group flex-1">
                      <label for="timeout" title="单次请求最大超时时间（秒），默认 180 秒">请求超时 (秒)</label>
                      <input
                        type="number"
                        id="timeout"
                        value="180"
                        min="10"
                        max="600"
                        title="单次挑战请求超时时间，单位秒"
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 操作按钮 -->
            <div class="form-actions">
              <button type="submit" class="btn btn-primary" id="btn-start" title="执行 3 轮长整数生成挑战，并在统一库中比对归因">
                <span class="btn-spinner hidden" id="start-spinner"></span>
                <span class="btn-text">开始测试 (共 3 题)</span>
              </button>
              <button type="button" class="btn btn-ghost" id="btn-reset" title="清空已保存的 Base URL 与 Key 等本地配置">
                重置
              </button>
            </div>
          </form>
        </section>

        <!-- 进度卡片 -->
        <section class="card progress-card hidden" id="progress-section">
          <div class="progress-header">
            <div class="progress-title-wrap">
              <h2 id="progress-title">探测测试进行中</h2>
              <span class="progress-status-desc" id="progress-status-desc">准备中...</span>
            </div>
            <div class="progress-numeric">
              <span id="progress-percent">0%</span>
              <small id="progress-count-text">完成 0/3 题</small>
            </div>
          </div>

          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%"></div>
          </div>

          <div class="probe-steps-grid" id="probe-steps">
            <div class="probe-step pending" id="step-0" title="挑战 1：约 300 位无语义长整数生成探针">
              <div class="step-badge">1</div>
              <div class="step-info">
                <strong>挑战 1</strong>
                <span class="step-state">等待中</span>
              </div>
              <div class="step-stat">-</div>
            </div>
            <div class="probe-step pending" id="step-1" title="挑战 2：约 300 位无语义长整数生成探针">
              <div class="step-badge">2</div>
              <div class="step-info">
                <strong>挑战 2</strong>
                <span class="step-state">等待中</span>
              </div>
              <div class="step-stat">-</div>
            </div>
            <div class="probe-step pending" id="step-2" title="挑战 3：约 300 位无语义长整数生成探针">
              <div class="step-badge">3</div>
              <div class="step-info">
                <strong>挑战 3</strong>
                <span class="step-state">等待中</span>
              </div>
              <div class="step-stat">-</div>
            </div>
          </div>

          <div class="status-alert hidden" id="status-alert"></div>
        </section>

        <!-- 归因结果卡片 -->
        <section class="card result-card hidden" id="result-section">
          <div class="card-header">
            <h2>归因诊断报告</h2>
            <span class="badge badge-success" title="3 题探针已完成分析与概率校准">测试已完成</span>
          </div>

          <!-- 胜出模型概览卡片 -->
          <div class="winner-hero" id="winner-hero">
            <div class="hero-item primary" title="当前候选库中后验概率最高的匹配模型">
              <span class="hero-label">最可能模型预测</span>
              <strong class="hero-val" id="winner-name">-</strong>
              <div class="hero-prob-bar">
                <span class="hero-prob-text" id="winner-prob">-</span>
              </div>
            </div>
            <div class="hero-item" title="所属模型家族（GPT 系列或 Claude 系列）及综合概率">
              <span class="hero-label">识别模型家族</span>
              <strong class="hero-val" id="family-name">-</strong>
              <span class="hero-sub" id="family-prob">-</span>
            </div>
            <div class="hero-item" title="通过长度与有效性阈值校验的有效样本数">
              <span class="hero-label">有效探针样本</span>
              <strong class="hero-val" id="valid-samples">-</strong>
              <span class="hero-sub">共 3 题测试</span>
            </div>
          </div>

          <!-- 诊断详情药丸条 -->
          <div class="diagnostics-bar" id="diagnostics-bar"></div>

          <!-- 结果表格 -->
          <div class="table-container">
            <table class="results-table">
              <thead>
                <tr>
                  <th style="width: 60px">排序</th>
                  <th>候选模型</th>
                  <th style="width: 130px">家族分类</th>
                  <th style="width: 220px" title="全局归一化后的闭集归因概率">归因概率</th>
                  <th style="width: 110px" title="特征分布与模型中心相似度">分布相似度</th>
                </tr>
              </thead>
              <tbody id="results-tbody">
                <!-- 动态填充 -->
              </tbody>
            </table>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <span title="本工具仅对指纹库内的模型进行归因分析，测试结果仅供技术参考">
          ModelTrace AI Detector · 纯本地运行 · 凭据不离开本机
        </span>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
